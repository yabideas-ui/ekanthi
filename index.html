<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://ekanthi-tutor.yabideas.workers.dev; frame-src 'self' blob: data: about:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b2239">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ekanthi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ekanthi — Learning & Coaching</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1b2230;--muted:#667085;--line:#e4e2db;--brand:#1f4e79;--brand2:#2b6aa3;--soft:#e8eff7;--ok:#1f8a5b;--okbg:#e6f4ec;--warn:#b7791f;--warnbg:#fdf3dc;--bad:#b23a3a;--badbg:#fbe9e9;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Malayalam",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
a{color:var(--brand2)}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12.5px}
h1,h2,h3{margin:0}
h2{font-size:16px}
h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid #c9d6e5}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #e6bcbc}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px #dbe7f3}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;font-weight:600;color:#3b4456;margin-bottom:5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p0{background:#eef0f3;color:#5b6474}.p1{background:var(--warnbg);color:#8a5a00}.p2{background:var(--okbg);color:#16683f}.p3{background:var(--soft);color:var(--brand)}
.pr-A{background:#fde8e8;color:#9b2c2c}.pr-B{background:#fdf3dc;color:#8a5a00}.pr-C{background:#e8eef7;color:#2c4a75}
.alert{background:var(--badbg);color:var(--bad)}
.good{background:var(--okbg);color:#16683f}
.bar{height:8px;background:#ebe9e3;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--brand2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;background:#faf9f6}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9fc}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #c9d6e5;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#1f4e79 0%,#183d5f 55%,#f5f4ef 55%)}
.login-box{width:100%;max-width:400px}
.brand{color:#fff;text-align:center;margin-bottom:18px}
.brand .logo{font-size:34px;font-weight:800;letter-spacing:.01em}
.brand .tag{opacity:.85;font-size:14px}
.seg{display:flex;background:#eef0f3;border-radius:10px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* student */
#student{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.s-head{background:var(--brand);color:#fff;padding:16px 16px 18px;border-radius:0 0 18px 18px}
.s-head .hi{font-size:20px;font-weight:800}
.s-head .sub{opacity:.85;font-size:13px}
.s-head .icon{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer}
.s-main{padding:14px}
.navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.navbar .in{display:flex;max-width:560px;width:100%}
.navbar button{flex:1;border:0;background:transparent;padding:10px 4px 9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.navbar button svg{width:22px;height:22px}
.navbar button.on{color:var(--brand)}
.streak{display:flex;gap:12px;align-items:center}
.streak .n{font-size:30px;font-weight:800;color:var(--brand)}
.task{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.task .dot{width:26px;height:26px;border-radius:50%;border:2px solid #c9d6e5;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.task.done .dot{background:var(--ok);border-color:var(--ok)}
.task .t{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.exam{flex:1;min-width:100px;border-radius:12px;padding:10px 12px;color:#fff}
.exam b{display:block;font-size:20px;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days span{aspect-ratio:1;border-radius:5px;background:#e9e7e0}
.days span.on{background:var(--ok)}
.days span.today{outline:2px solid var(--brand2);outline-offset:1px}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.q .qt{font-weight:700;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:7px;cursor:pointer;background:#fff}
.opt.sel{border-color:var(--brand2);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .l{font-weight:800;color:var(--muted);width:18px;flex:none}
.explain{margin-top:10px;font-size:14px;background:#f7f6f2;border-radius:10px;padding:10px 12px}
.score{font-size:42px;font-weight:800;color:var(--brand)}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:380px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.m{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;color:var(--muted);font-size:12px;text-align:center;background:none}
.msg .say{background:none;border:0;color:var(--brand2);font-size:12px;font-weight:700;cursor:pointer;padding:4px 0 0}
.composer{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px}
.composer textarea{border:0;min-height:40px;max-height:110px;resize:none;box-shadow:none!important;padding:8px}
.composer button{border:0;border-radius:10px;padding:0 12px;cursor:pointer;background:var(--soft);color:var(--brand);font-size:17px}
.composer .send{background:var(--brand);color:#fff;font-size:14px;font-weight:700}
.rec{background:var(--badbg)!important;color:var(--bad)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.wa{background:#25D366;color:#fff;border:0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;text-decoration:none}
/* tutor */
#tutor{min-height:100vh}
.t-head{background:var(--brand);color:#fff}
.t-head .in{max-width:1180px;margin:0 auto;padding:14px 20px 0}
.t-head .logo{font-size:20px;font-weight:800}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:#cfdced;font-weight:700;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--brand)}
.t-main{max-width:1180px;margin:0 auto;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi b{display:block;font-size:28px;font-weight:800;margin-top:4px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px}
.subtabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal>div{border-radius:8px;padding:6px;min-height:58px;background:#f1efe9;font-size:11.5px}
.cal>div .d{font-weight:700;color:var(--muted)}
.cal>div.l1{background:#dcefe3}.cal>div.l2{background:#b5dfc4}.cal>div.l3{background:#7cc79a}
.cal>div.fut{background:transparent;border:1px dashed var(--line)}
.creds{background:var(--okbg);border:1px solid #bfe3cd;border-radius:12px;padding:14px}
.creds code{font-size:18px;font-weight:800;background:#fff;padding:2px 8px;border-radius:6px}
.scroll{overflow-x:auto}
.inline input,.inline select{padding:6px 8px;border-radius:8px}
.seg4 button{font-size:12.5px;padding:8px 4px}
.qcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}
.qcard .qh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.model{background:#f3f7fb;border:1px solid #d9e5f1;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs .pg{position:absolute;left:4px;bottom:4px;background:rgba(11,31,51,.75);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}.thumbs .pw{position:absolute;left:4px;top:4px;font-size:13px;background:#fff8e1;border-radius:6px;padding:0 3px}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;cursor:pointer}
.sec-h{margin:18px 0 8px;font-weight:800;color:var(--brand)}
.anal li{margin:4px 0}
.mark-in{width:70px!important;display:inline-block}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.notes{font-size:14.5px;line-height:1.6}
.notes .nh{display:block;font-weight:800;color:var(--brand);margin:12px 0 4px;font-size:15px}
.mat{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
.mat .mt{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mat .ic{width:34px;height:34px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.mat img.full{width:100%;max-height:640px;object-fit:contain;background:#faf9f6;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
.chrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.dotnew{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.vizbox{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;margin:8px 0;text-align:left;max-width:900px}
.vizbox iframe{width:100%;aspect-ratio:8/5;border:0;border-radius:8px;background:#fff;display:block}
.vizbox:fullscreen{padding:20px;overflow:auto}.vizbox:fullscreen iframe{height:80vh;aspect-ratio:auto}
.vizbox ol{margin:8px 0 0 18px;padding:0}
.quick button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:700;font-size:13px;cursor:pointer}
.hw{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.hw.over{border-color:#e6bcbc;background:#fffafa}
.timer-bar{position:sticky;top:0;z-index:6}
/* report */
#report{max-width:820px;margin:0 auto;padding:16px}
.rp-head{background:var(--brand);color:#fff;border-radius:16px;padding:18px}
.rp-status{border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center}
.rp-status .big{font-size:40px;line-height:1}
.rp-green{background:#e6f4ec;color:#145c37}.rp-amber{background:#fdf3dc;color:#7a4f00}.rp-red{background:#fbe9e9;color:#8f2a2a}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;margin-top:2px}
.tile .ml{font-size:12px;color:var(--muted)}
.al{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:14px}
.al.red{background:var(--badbg);color:#8f2a2a}.al.amber{background:var(--warnbg);color:#7a4f00}
.subj-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;border-top:4px solid var(--brand2)}
.trend-up{color:var(--ok);font-weight:800}.trend-down{color:var(--bad);font-weight:800}
.tc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.tc-ch{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.tc-ch.done{background:var(--okbg);border-color:#bfe3cf}.tc-ch.on{outline:3px solid var(--brand2);outline-offset:1px}
.tc-notes{line-height:1.6}.tc-notes.big{font-size:21px;line-height:1.7}
.pl-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.pl-date{width:86px;flex:none;font-size:12.5px;color:var(--muted);font-weight:700}
.pl-item{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:8px;padding:3px 8px;margin:2px;background:#f3f5f8;border-left:3px solid #2b6aa3}
.pl-item.exam{background:var(--badbg);border-left-color:var(--bad);font-weight:700}
.pl-item.mock{background:#fff4e5}.pl-item.revise{background:#eef7f1}
.pl-check{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14px}
.pl-check.done{opacity:.6;text-decoration:line-through}
.badge{display:inline-block;background:#fff6dd;border:1px solid #f1dfa6;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;margin:2px}
@media print{.noprint,.navbar{display:none!important} body{background:#fff}}
/* ===== premium theme ===== */
:root{--bg:#f3f5f9;--ink:#0f1b2d;--muted:#5d6b82;--line:#e3e8f0;--brand:#143a5e;--brand2:#2563a6;--gold:#f2b632;--gold2:#ffd36b;--navy:#0b2239;--r:18px;--shadow:0 1px 2px rgba(15,27,45,.04),0 8px 24px rgba(15,27,45,.06)}
body{background:radial-gradient(1200px 500px at 50% -200px,#e4ecf7 0%,var(--bg) 60%) fixed;letter-spacing:-.005em}
.card{border:1px solid rgba(20,58,94,.07);box-shadow:var(--shadow)}
h2{font-size:17px;letter-spacing:-.01em}
.btn{background:linear-gradient(180deg,#1d4f80,#143a5e);box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 14px rgba(20,58,94,.22);border-radius:12px;transition:transform .08s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;box-shadow:none;border:1px solid #cfdcec}
.btn.danger{background:#fff;box-shadow:none}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d00;box-shadow:0 6px 16px rgba(242,182,50,.35)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{background:#e8edf4}.bar>span{background:linear-gradient(90deg,#2563a6,#3f8fe0)}
/* login */
#login{background:radial-gradient(700px 420px at 15% 10%,#2d6db0 0%,transparent 60%),radial-gradient(600px 400px at 90% 90%,#7a5a12 0%,transparent 55%),linear-gradient(160deg,#0b2239 0%,#123a60 60%,#0b2239 100%)}
.brand .mark{width:64px;height:64px;margin:0 auto 10px;border-radius:20px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#0b2239;box-shadow:0 10px 30px rgba(242,182,50,.35)}
.brand .logo{font-size:40px;letter-spacing:-.02em}
.brand .tag{color:#d8e4f2}
#login .card{background:rgba(255,255,255,.97);border:0;box-shadow:0 30px 80px rgba(0,0,0,.35);border-radius:22px;padding:20px}
.intro-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:11px;font-weight:700;cursor:pointer;width:100%;font-size:14px}
/* student */
.s-head{background:radial-gradient(500px 200px at 90% 0%,rgba(242,182,50,.28),transparent 60%),linear-gradient(150deg,#0b2239,#1d4f80);padding:18px 18px 22px;border-radius:0 0 26px 26px;box-shadow:0 10px 30px rgba(11,34,57,.25)}
.s-head .hi{font-size:22px;letter-spacing:-.01em}
.s-head .icon{backdrop-filter:blur(6px)}
.navbar{background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid rgba(20,58,94,.08)}
.navbar button.on{color:var(--brand)}
.navbar button.on svg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0b2239;border-radius:10px;padding:3px;width:30px;height:28px;margin-top:-4px}
.access{display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#fff6df,#fffaf0);border:1px solid #f5dc9b;border-radius:16px;padding:12px 14px;font-size:14px}

function api(path, body){
  var opt = {method: body===undefined?"GET":"POST", headers:{}};
  if(token) opt.headers.Authorization = "Bearer "+token;
  opt.headers["X-App-Version"]=String(APP_VERSION);
  if(body!==undefined){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  return fetch(API_URL+path, opt).then(function(r){
    return r.json().catch(function(){return {};}).then(function(d){
      if(r.status===426){ appUpdate(true); }
      if(r.status===503 && d.maintenance){ showMaint(d.error); }
      if(r.status===401 && path!=="/api/login"){ logout(true); throw new Error(d.error||"Please log in again"); }
      if(!r.ok){ var e=new Error(d.error||("Error "+r.status)); e.status=r.status; e.data=d; throw e; }
      if(body!==undefined) draftSent(path);
      return d;
    });
  });
}

function fetchFile(id){

function weakHtml(w){

function lineChart(pts){
  var W=520,H=170,L=34,R=10,T=10,B=26,n=pts.length;
  var x=function(i){return L+(n<2?0:i*(W-L-R)/(n-1));}, y=function(v){return T+(100-v)*(H-T-B)/100;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Score trend">';
  [0,50,100].forEach(function(v){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#ebe9e3"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" font-size="10" fill="#667085" text-anchor="end">'+v+'%</text>'; });
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(33)+'" y2="'+y(33)+'" stroke="#b23a3a" stroke-dasharray="4 4"/>';
  s+='<polyline fill="none" stroke="#2b6aa3" stroke-width="2.5" points="'+pts.map(function(p,i){return x(i)+','+y(p.y);}).join(" ")+'"/>';
  pts.forEach(function(p,i){ s+='<circle cx="'+x(i)+'" cy="'+y(p.y)+'" r="3.5" fill="#fff" stroke="#2b6aa3" stroke-width="2"><title>'+esc(p.x)+': '+p.y+'%</title></circle>'; if(n<=8||i%2===0) s+='<text x="'+x(i)+'" y="'+(H-8)+'" font-size="10" fill="#667085" text-anchor="middle">'+esc(p.x)+'</text>'; });
  return s+'</svg>';
}

function sylAll(btn){ btn.disabled=true; var done=0, tried=0;
  var step=function(){ api("/api/admin/chapter/topics-all",{}).then(function(r){ done+=r.done; tried+=r.tried; var n=$("sylAllNote"); if(n) n.innerHTML='<span class="spinner"></span> '+done+' chapters updated · '+r.remaining+' left (of '+r.total+')';
      if(r.remaining>0 && r.tried>0 && $("sylAll")) setTimeout(step, 400); else { btn.disabled=false; if(n) n.textContent='✅ Done — '+done+' chapters updated'+(tried-done?' · '+(tried-done)+' not found (open 📚 Syllabus topics to add them by hand)':'')+'. New questions now follow these topics.'; } })

function classClick(b){
  if(b.dataset.cls){ T.clsSel=Number(b.dataset.cls); renderClasses(); return; }
  var a=b.dataset.ca, id=Number(b.dataset.id); if(!a) return;
  var done=function(msg){ return function(){ toast(msg||"Saved"); loadClasses(); }; }, fail=function(e){ toast(e.message); };
  if(a==="loadsyl"){ if(!confirm("Add Class 3–9 with NCERT 2026-27 chapters (Maths, EVS/Science, Social Science)? Subjects that already have chapters are not changed.")) return;
    b.disabled=true; b.innerHTML='<span class="spinner"></span> Loading…';
    api("/api/admin/load-syllabus",{}).then(function(r){ alert("Done:\n\n"+r.log.join("\n")); loadClasses(); }).catch(fail); return; }
  if(a==="newclass"){ var n=prompt("New class name (e.g. Class 9)"); if(n) api("/api/admin/class/save",{name:n, board:"CBSE"}).then(function(){ api("/api/admin/classes").then(function(d){ T.classes=d.classes; var c=d.classes.filter(function(x){return x.name===n;}).pop(); if(c){ T.clsSel=c.id; } renderClasses(); }); }).catch(fail); }
  if(a==="saveclass") api("/api/admin/class/save",{id:T.clsSel, name:$("ccName").value, board:$("ccBoard").value, plan_start:$("ccStart").value}).then(done()).catch(fail);
  if(a==="delclass"){ if(confirm("Delete this class with all its subjects and chapters?")) api("/api/admin/class/delete",{id:T.clsSel}).then(done("Deleted")).catch(fail); }
  if(a==="savesub"){ var g=function(f){ return document.querySelector('[data-sf="'+f+'"][data-sid="'+id+'"]').value; }; api("/api/admin/subject/save",{id:id, name:g("name"), exam_date:g("exam_date"), color:g("color"), optional:document.querySelector('[data-sf="optional"][data-sid="'+id+'"]').checked}).then(done()).catch(fail); }
  if(a==="takers"){ subTakers(id); return; }
  if(a==="skill"){ if(!confirm("Add the CBSE skill subject 'Artificial Intelligence (417)' to this class? 6 units from the CBSE AI Facilitator Handbook (Grade X) are added with their topics. It is ⭐ optional — then choose which students take it.")) return; b.disabled=true;
    api("/api/admin/skill-subject",{class_id:T.clsSel, key:b.dataset.k}).then(function(r){ toast("✅ Added"+(r.added?" — "+r.added+" units":"")+". Now pick the students."); loadClasses(); setTimeout(function(){ subTakers(r.subject_id); },600); }).catch(fail); return; }
  if(a==="delsub"){ if(confirm("Delete this subject and its chapters?")) api("/api/admin/subject/delete",{id:id}).then(done("Deleted")).catch(fail); }
  if(a==="addlang"){ api("/api/admin/subject/save",{class_id:T.clsSel, name:b.dataset.l}).then(done(b.dataset.l+" added — open it and paste or suggest chapters")).catch(fail); }
  if(a==="warm"){ var sj=null; T.classes.forEach(function(c){ c.subjects.forEach(function(x){ if(x.id===id) sj=x; }); }); if(!sj||!sj.chapters.length){ toast("No chapters yet"); return; }
    if(!confirm("Prepare Ekanthi notes + important questions for all "+sj.chapters.length+" chapters of "+sj.name+"? Takes about 30–40 sec per chapter — keep this page open.")) return;
    var list=sj.chapters.map(function(c){return c.id;}), k=0, fails=0; b.disabled=true;
    (function next(){ if(k>=list.length){ b.disabled=false; b.textContent="⚡ Prepared ✓"+(fails?" ("+fails+" retry)":""); toast(sj.name+": all chapters ready"); return; }
      b.innerHTML='<span class="spinner"></span> Preparing '+(k+1)+' / '+list.length;
      api("/api/admin/warm",{chapter_id:list[k]}).then(function(r){ if(r.done && r.done.some(function(x){return /fail/.test(x);})) fails++; }).catch(function(){ fails++; }).then(function(){ k++; next(); }); })();
    return; }
  if(a==="suggest"){ b.disabled=true; b.innerHTML='<span class="spinner"></span> Finding chapters…'; api("/api/admin/suggest-chapters",{subject_id:id}).then(function(r){ $("bulk-"+id).value=r.chapters.join("\n"); $("sug-"+id).textContent=(r.book?"Book: "+r.book+". ":"")+(r.note||"")+" — check with the textbook, edit, then Add all."; b.disabled=false; b.textContent="✨ Suggest again"; }).catch(function(e){ toast(e.message); b.disabled=false; b.textContent="✨ Suggest NCERT chapter list"; }); }
  if(a==="addsub"){ var sn=$("nsubName").value.trim(); if(sn) api("/api/admin/subject/save",{class_id:T.clsSel, name:sn}).then(done("Subject added")).catch(fail); }
  if(a==="addch"){ var nm=$("nc-"+id).value.trim(); if(nm) api("/api/admin/chapter/save",{subject_id:id, name:nm, priority:$("ncp-"+id).value, week:$("ncw-"+id).value}).then(done("Chapter added")).catch(fail); }
  if(a==="delch"){ if(confirm("Delete this chapter?")) api("/api/admin/chapter/delete",{id:id}).then(done("Deleted")).catch(fail); }
  if(a==="bulk"){ var tx=$("bulk-"+id).value; if(tx.trim()) api("/api/admin/chapters/bulk",{subject_id:id, text:tx}).then(function(r){ toast(r.added+" chapters added"); loadClasses(); }).catch(fail); }
}

function csvDownload(L, name){ var csv="﻿"+L.map(function(x){ return x.map(function(v){ v=v===null||v===undefined?"":String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","); }).join("\n");
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); }
var LOG_NAMES={place:"opened page",left:"left the app",back:"came back",idle:"idle",camera:"camera / gallery",paste:"pasted text",blur:"switched window",submit:"submitted",logout:"logout",integrity:"honesty check",screenshot:"screenshot",report:"reported wrong answer",react:"reacted to message",seen:"read message"};
function dlActivity(sid, period, date, name){ toast("Preparing activity log…");
  api("/api/admin/activity-log?period="+period+"&date="+date+(sid?"&student_id="+sid:"")).then(function(d){ var L=[["Date","Time","Student","Class","Activity","Details"]];
    d.rows.forEach(function(r){ var t=new Date(r.at); L.push([t.toLocaleDateString("en-CA"), t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"}), r.name, r.cls, LOG_NAMES[r.kind]||r.kind, r.detail]); });
    if(d.rows.length<1) return toast("No activity in this period");
    csvDownload(L, "ekanthi-activity-"+(name? name.replace(/\s+/g,"_") : "all-students")+"-"+period+"-"+d.range.from+".csv"); toast("✅ "+d.rows.length+" rows downloaded"); }).catch(function(e){ toast(e.message); }); }
// ----- tutor: messages to students (send, see who read, reactions, replies) -----
var MS={d:null, to:"all", pick:{}};
var MS_KIND=[["note","💬 Note"],["praise","🌟 Praise"],["remind","⏰ Reminder"],["warn","⚠️ Warning"],["event","📅 Event / class"]];
function loadMsgs(){ loading(); api("/api/admin/messages").then(function(d){ MS.d=d; renderMsgs(); }).catch(showErr); }
function reactSum(s){ var c={}; (String(s||"").match(/👍|❤️|😊|🙏|✅|😕/g)||[]).forEach(function(r){ c[r]=(c[r]||0)+1; }); return Object.keys(c).map(function(r){ return r+" "+c[r]; }).join("  "); }
function renderMsgs(){ var d=MS.d;
  var h='<div class="grid2" style="align-items:start"><div class="card"><h3 style="margin-bottom:10px">✉️ New message</h3>';
  h+='<label>To</label><select id="msTo"><option value="all">All students ('+d.students.length+')</option>'+d.classes.filter(function(c){ return d.students.some(function(s){return s.class_id===c.id;}); }).map(function(c){ return '<option value="c'+c.id+'"'+(MS.to==="c"+c.id?' selected':'')+'>'+esc(c.name)+' — whole class ('+d.students.filter(function(s){return s.class_id===c.id;}).length+')</option>'; }).join("")+'<option value="pick"'+(MS.to==="pick"?' selected':'')+'>Choose students…</option></select>';
  h+='<div id="msPick" style="'+(MS.to==="pick"?'':'display:none;')+'max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px">'+d.students.map(function(s){ return '<label style="display:flex;gap:8px;align-items:center;font-weight:500;margin:4px 0"><input type="checkbox" data-pk="'+s.id+'"'+(MS.pick[s.id]?' checked':'')+' style="width:auto"> '+esc(s.name)+' <span class="muted small">'+esc(s.class_name||"")+'</span></label>'; }).join("")+'</div>';
  h+='<label style="margin-top:10px">Type</label><div class="row" style="gap:6px;flex-wrap:wrap" id="msKind">'+MS_KIND.map(function(k,i){ return '<button class="btn sm '+(i===0?'':'ghost')+'" data-mk="'+k[0]+'">'+k[1]+'</button>'; }).join("")+'</div>';
  h+='<label style="margin-top:10px">Title (optional)</label><input type="text" id="msTitle" maxlength="120" placeholder="e.g. Maths test on Monday">';
  h+='<label style="margin-top:10px">Message</label><textarea id="msBody" rows="5" maxlength="2000" placeholder="Write your message…"></textarea>';
  h+='<button class="btn block" id="msSend" style="margin-top:12px">Send message</button><div class="muted small" style="margin-top:6px">Students see it in the 🔔 bell in their app, get a popup, and a phone notification if they turned notifications on. They can react (👍 ❤️ 😊 🙏 ✅ 😕) or reply.</div></div>';
  h+='<div class="card"><h3 style="margin-bottom:8px">📨 Sent messages</h3>'+(d.messages.length? d.messages.map(function(m){ var pc=m.sent? Math.round(m.seen*100/m.sent):0;
      return '<div class="ib-row" data-msd="'+m.id+'" style="border-bottom:1px solid var(--line);border-radius:0"><div class="ib-ic">'+({note:"💬",praise:"🌟",remind:"⏰",warn:"⚠️",event:"📅"}[m.kind]||"💬")+'</div><div style="flex:1;min-width:0"><b>'+esc(m.title||m.body.slice(0,50))+'</b><div class="small muted">To '+esc(m.target_name)+' · '+fmtDT(m.created_at)+(m.from_name?' · by '+esc(m.from_name):'')+'</div>'+

    var b=this; b.disabled=true; b.textContent="Sending…";
    api("/api/admin/message/send", req).then(function(r){ toast("✅ Sent to "+r.sent+" student"+(r.sent>1?"s":"")); MS.pick={}; draftSent("/api/admin/message/send"); loadMsgs(); }).catch(function(e){ b.disabled=false; b.textContent="Send message"; toast(e.message); }); };

  if(ds.tcch){ if(ds.tcs) TC.subj=Number(ds.tcs); tcOpen(Number(ds.tcch)); return; }
  if(ds.tcp){ var id=Number(ds.tcp), i=TC.present.indexOf(id); if(i>=0) TC.present.splice(i,1); else TC.present.push(id); renderTeach(); return; }
  if(ds.tcbig){ TC.big=!TC.big; renderTeach(); return; }
  if(ds.tcans){ TC.showAns[ds.tcans]=!TC.showAns[ds.tcans]; renderTeach(); return; }
  if(ds.tcfile){ b.disabled=true; openFile(Number(ds.tcfile)).catch(function(e){toast(e.message);}).then(function(){ b.disabled=false; }); return; }
  if(ds.tcai){ b.disabled=true; b.innerHTML='<span class="spinner"></span> Making notes…'; api("/api/admin/ai-notes",{chapter_id:TC.ch, lang:ds.tcai}).then(function(){ tcOpen(TC.ch); }).catch(function(e){ toast(e.message); b.disabled=false; b.textContent="✨ Try again"; }); return; }
  if(ds.tcimp){ b.disabled=true; b.innerHTML='<span class="spinner"></span> Loading…'; api("/api/admin/teach/imp",{chapter_id:TC.ch}).then(function(r){ TC.cd.imp=r.imp; renderTeach(); }).catch(function(e){ toast(e.message); b.disabled=false; b.textContent="⭐ Try again"; }); return; }
  if(ds.tchw){ tGo("homework"); return; }
  if(ds.tcml){ TC.ml=!TC.ml; renderTeach(); return; }
  if(ds.tcmic){ tcListen(b); return; }
  if(ds.tcask){ tcAsk(); return; }
  if(ds.tcviz){ var tq=$("tcQ").value.trim(), ch=TC.ch; TC.viz=TC.viz||{}; var L=TC.viz[ch]=TC.viz[ch]||[], item={busy:true, topic:tq||TC.cd.chapter.name}; L.push(item); $("tcQ").value=""; renderTeach();
    api("/api/admin/visual",{chapter_id:ch, topic:tq, langs:TC.d.students.filter(function(x){return TC.present.indexOf(x.id)>=0;}).map(function(x){return x.lang||"ml";})}).then(function(v){ L[L.indexOf(item)]=v; }).catch(function(e){ item.busy=false; item.err=e.message; }).then(function(){ if(TC.ch===ch) renderTeach(); }); return; }
  if(ds.gpt){ tcGpt(ds.gpt); return; }
  if(ds.tcdel){ if(confirm("Delete this class entry?")) api("/api/admin/teach/delete",{id:Number(ds.tcdel)}).then(function(){ teachClass(TC.cls); }); return; }
  if(ds.tcsave){ if(TC.d.students.length && !TC.present.length && !confirm("No students marked present. Save anyway?")) return;
    b.disabled=true;
    api("/api/admin/teach/save",{chapter_id:TC.ch, present:TC.present, date:$("tcDate").value, note:$("tcNote").value}).then(function(r){
      toast("Class saved ✓ "+r.present+" present"+(r.absent?", "+r.absent+" absent":"")); var ch=TC.ch;
      api("/api/admin/teach?class_id="+TC.cls).then(function(d){ TC.d=d; tcOpen(ch); });
    }).catch(function(e){ $("tcErr").textContent=e.message; b.disabled=false; }); return; }
}

// ----- tutor: exam plans -----
var PM={list:null, classes:null, students:null, form:false, f:{}, preview:null, detail:null};
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function loadPlans(){ loading(); Promise.all([api("/api/admin/plans"), api("/api/admin/classes"), api("/api/admin/overview")]).then(function(r){ PM.list=r[0]; PM.classes=r[1].classes; PM.students=r[2].students; PM.detail=null; renderPlans(); }).catch(showErr); }
function pmClass(){ return PM.classes.filter(function(c){return c.id===PM.f.class_id;})[0]; }
function grabPlanForm(){
  var f=PM.f; f.title=($("pfTitle")||{}).value||f.title; f.start=($("pfStart")||{}).value||f.start;
  document.querySelectorAll("[data-pfexam]").forEach(function(x){ f.exams[x.dataset.pfexam]=x.value; });
}
function renderPlans(){
  if(PM.detail) return renderPlanDetail();
  var h='<div class="card"><div class="row between" style="margin-bottom:10px"><h2>Exam study plans</h2><button class="btn sm" data-pm="new">+ New exam plan</button></div>';
  if(PM.form) h+=planFormHtml();
  var L=PM.list.plans;
  h+= L.length? '<table><thead><tr><th>Plan</th><th>Class</th><th>From</th><th>Last exam</th><th>For</th><th></th></tr></thead><tbody>'+L.map(function(p){ return '<tr class="click" data-pid="'+p.id+'"><td><b>'+esc(p.title)+'</b>'+(p.warnings.length?' <span class="pill p1">'+p.warnings.length+' note</span>':'')+'</td><td>'+esc(p.class_name||"")+'</td><td>'+fmtDate(p.start_date)+'</td><td>'+fmtDate(p.end_date)+'</td><td class="small">'+(p.student_ids?'Selected students':'Whole class')+'</td><td><button class="btn danger sm" data-pm="del" data-id="'+p.id+'">✕</button></td></tr>'; }).join("")+'</tbody></table>' : '<div class="empty">No exam plans yet. Click “New exam plan”: choose the class, exam dates and chapters — Ekanthi makes the day-by-day plan.</div>';
  $("tMain").innerHTML=h+'</div>';
}
function planFormHtml(){
  var f=PM.f; if(!f.class_id && PM.classes[0]) f.class_id=PM.classes[0].id;
  var c=pmClass()||{subjects:[],name:""}, g=(String(c.name).match(/(\d{1,2})/)||[0,10])[1]*1;
  if(!f.init || f.init!==f.class_id){ f.init=f.class_id; f.subj={}; f.exams={}; f.chs={}; c.subjects.forEach(function(s){ f.subj[s.id]=s.chapters.length>0; f.exams[s.id]=s.exam_date||""; f.chs[s.id]=null; }); f.rev=g<=5?2:4; f.per=2; f.off=[0]; f.who="all"; f.sids=[]; }
  if(!f.start) f.start=PM.list.today;
  var studs=PM.students.filter(function(x){return x.class_id===f.class_id && x.active;});
  var h='<div class="card stack" style="background:#faf9f6;margin-bottom:14px">';
  h+='<div class="grid3"><div><label class="f">Class</label><select data-pf="class_id">'+PM.classes.map(function(x){return '<option value="'+x.id+'"'+(x.id===f.class_id?' selected':'')+'>'+esc(x.board+" "+x.name)+'</option>';}).join("")+'</select></div><div><label class="f">Plan name</label><input id="pfTitle" type="text" value="'+esc(f.title||"")+'" placeholder="e.g. Board exam 2027 / Half-yearly"></div><div><label class="f">Start from</label><input id="pfStart" type="date" value="'+esc(f.start)+'"></div></div>';
  h+='<div class="grid3"><div><label class="f">Subjects per day</label><select data-pf="per">'+[1,2,3].map(function(n){return '<option'+(n===f.per?' selected':'')+'>'+n+'</option>';}).join("")+'</select></div><div><label class="f">Revision days before each exam</label><select data-pf="rev">'+[1,2,3,4,5,7,10].map(function(n){return '<option'+(n===f.rev?' selected':'')+'>'+n+'</option>';}).join("")+'</select></div><div><label class="f">Holidays (no study)</label><div class="chips">'+DOW.map(function(d,i){return '<button class="chip'+(f.off.indexOf(i)>=0?' on':'')+'" data-pfoff="'+i+'">'+d+'</button>';}).join("")+'</div></div></div>';
  h+='<div><label class="f">For</label><div class="chips"><button class="chip'+(f.who==="all"?' on':'')+'" data-pfwho="all">Whole class ('+studs.length+')</button><button class="chip'+(f.who==="some"?' on':'')+'" data-pfwho="some">Selected students</button></div>'+(f.who==="some"? '<div class="chips" style="margin-top:6px">'+studs.map(function(x){return '<button class="chip'+(f.sids.indexOf(x.id)>=0?' on':'')+'" data-pfsid="'+x.id+'">'+esc(x.name)+'</button>';}).join("")+'</div>' : '')+'</div>';
  h+='<div><label class="f">Subjects, exam dates and chapters</label>'+(c.subjects.length? c.subjects.map(function(s){ var on=f.subj[s.id], sel=f.chs[s.id]; return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff"><div class="row between"><label class="row" style="gap:8px"><input type="checkbox" data-pfsubj="'+s.id+'"'+(on?' checked':'')+'><b>'+esc(s.name)+'</b> <span class="muted small">'+s.chapters.length+' chapters</span></label><div class="row small">Exam date <input type="date" data-pfexam="'+s.id+'" value="'+esc(f.exams[s.id]||"")+'" style="width:auto"></div></div>'+
      (on? '<div class="small" style="margin-top:6px">Chapters: <b>'+(sel? sel.length+' selected':'all')+'</b> <button class="btn ghost sm" data-pfchs="'+s.id+'">'+(sel?'Use all':'Choose chapters')+'</button></div>'+(sel? '<div class="chips" style="margin-top:6px">'+s.chapters.map(function(ch){return '<button class="chip'+(sel.indexOf(ch.id)>=0?' on':'')+'" data-pfch="'+ch.id+'" data-s="'+s.id+'">'+esc(ch.name)+'</button>';}).join("")+'</div>' : '') : '')+'</div>'; }).join("") : '<div class="muted">This class has no subjects. Add them in Classes (or Load NCERT syllabus).</div>')+'</div>';
  h+='<div class="row"><button class="btn ghost sm" data-pm="preview">Preview plan</button><button class="btn sm" data-pm="create">Create plan</button><button class="btn ghost sm" data-pm="cancel">Cancel</button><span class="err" id="pfErr"></span></div>';
  if(PM.preview) h+=planPreviewHtml(PM.preview, c);
  return h+'</div>';
}
function planBody(){
  var f=PM.f, c=pmClass();
  return {class_id:f.class_id, title:f.title, start_date:f.start, per_day:f.per, rev_days:f.rev, off_days:f.off, student_ids:f.who==="some"?f.sids:[],
    subjects:c.subjects.filter(function(s){return f.subj[s.id] && f.exams[s.id];}).map(function(s){ return {id:s.id, exam:f.exams[s.id], chapter_ids:f.chs[s.id]||[]}; })};
}
function planWeeksHtml(items, subs, todayStr, limitDays){
  var col={}; (subs||[]).forEach(function(s){col[s.id]=s;});
  var g={}; items.forEach(function(i){ if(limitDays && i.date>addDays(todayStr,limitDays)) return; (g[i.date]=g[i.date]||[]).push(i); });
  return Object.keys(g).sort().map(function(dt){ return '<div class="pl-row"'+(dt===todayStr?' style="background:#f3f7fb"':'')+'><div class="pl-date">'+DOW[new Date(dt+"T00:00:00Z").getUTCDay()]+' '+fmtDate(dt)+'</div><div>'+g[dt].map(function(i){ var s=col[i.subject_id]||{}; return '<span class="pl-item '+i.kind+'" style="border-left-color:'+esc(s.color||"#2b6aa3")+'"><b>'+esc(s.name||"")+'</b> '+esc(i.note.replace(new RegExp("^"+(s.name||"x")+":\\s*"),""))+'</span>'; }).join("")+'</div></div>'; }).join("");
}
function planPreviewHtml(p, c){
  var learn=p.items.filter(function(i){return i.kind==="learn";}).length, rev=p.items.filter(function(i){return i.kind==="revise";}).length, mock=p.items.filter(function(i){return i.kind==="mock";}).length;
  return '<div class="card stack" style="margin-top:8px"><div class="row between"><h3>Preview</h3><span class="muted small">'+learn+' study · '+rev+' revision · '+mock+' mock days · ends '+fmtDate(p.end)+'</span></div>'+(p.warnings.length? p.warnings.map(function(w){return '<div class="al amber">⚠️ '+esc(w)+'</div>';}).join("") : '')+'<div style="max-height:420px;overflow:auto">'+planWeeksHtml(p.items, c.subjects, PM.list.today, 0)+'</div></div>';
}
function planChange(e){
  var el=e.target;
  if(el.dataset.pf){ grabPlanForm(); var k=el.dataset.pf; PM.f[k]= k==="class_id"||k==="per"||k==="rev" ? Number(el.value) : el.value; PM.preview=null; renderPlans(); return; }
  if(el.dataset.pfsubj){ grabPlanForm(); PM.f.subj[el.dataset.pfsubj]=el.checked; PM.preview=null; renderPlans(); return; }
  if(el.dataset.pfexam){ PM.f.exams[el.dataset.pfexam]=el.value; PM.preview=null; }
}
function planClick(b){
  var a=b.dataset.pm, f=PM.f;
  if(b.dataset.pfoff){ grabPlanForm(); var d=Number(b.dataset.pfoff), i=f.off.indexOf(d); if(i>=0) f.off.splice(i,1); else if(f.off.length<5) f.off.push(d); PM.preview=null; renderPlans(); return; }
  if(b.dataset.pfwho){ grabPlanForm(); f.who=b.dataset.pfwho; renderPlans(); return; }
  if(b.dataset.pfsid){ grabPlanForm(); var sid=Number(b.dataset.pfsid), j=f.sids.indexOf(sid); if(j>=0) f.sids.splice(j,1); else f.sids.push(sid); renderPlans(); return; }
  if(b.dataset.pfchs){ grabPlanForm(); var s=b.dataset.pfchs; f.chs[s]= f.chs[s]? null : []; PM.preview=null; renderPlans(); return; }
  if(b.dataset.pfch){ grabPlanForm(); var arr=f.chs[b.dataset.s], id=Number(b.dataset.pfch), k=arr.indexOf(id); if(k>=0) arr.splice(k,1); else arr.push(id); PM.preview=null; renderPlans(); return; }
  if(a==="new"){ PM.form=true; PM.f={}; PM.preview=null; renderPlans(); return; }
  if(a==="cancel"){ PM.form=false; PM.preview=null; renderPlans(); return; }
  if(a==="del"){ if(confirm("Delete this exam plan?")) api("/api/admin/plan/delete",{id:Number(b.dataset.id)}).then(loadPlans); return; }
  if(a==="preview"||a==="create"){ grabPlanForm(); var body=planBody();
    if(!body.subjects.length){ $("pfErr").textContent="Tick at least one subject and set its exam date"; return; }
    if(f.who==="some" && !f.sids.length){ $("pfErr").textContent="Choose students"; return; }
    b.disabled=true;
    api(a==="preview"?"/api/admin/plan/preview":"/api/admin/plan/create", body).then(function(r){
      if(a==="preview"){ PM.preview=r; renderPlans(); return; }
      toast("Exam plan created"+(r.warnings.length?" (see notes)":"")); PM.form=false; PM.preview=null; loadPlans();
    }).catch(function(er){ $("pfErr").textContent=er.message; b.disabled=false; }); return; }
}
function renderPlanDetail(){
  var d=PM.detail, p=d.plan;
  var h='<a href="#" data-pmback="1">← All exam plans</a><div class="card stack" style="margin-top:10px"><div class="row between"><h2 style="font-size:19px">'+esc(p.title)+'</h2><span class="muted">'+fmtDate(p.start_date)+' → '+fmtDate(p.end_date)+'</span></div>'+(p.warnings.length? p.warnings.map(function(w){return '<div class="al amber">⚠️ '+esc(w)+'</div>';}).join("") : '')+'</div>';
  h+='<div class="card" style="margin-top:12px"><h3 style="margin-bottom:8px">Students on this plan</h3>'+(d.students.length? '<table><thead><tr><th>Student</th><th>Done</th><th>Due so far</th><th>Behind</th><th>Pending items</th></tr></thead><tbody>'+d.students.map(function(x){ return '<tr><td><b>'+esc(x.name)+'</b></td><td>'+x.done+'/'+x.total+'<div class="bar" style="width:120px;margin-top:4px"><span style="width:'+pct(x.done,x.total)+'%;background:var(--ok)"></span></div></td><td>'+x.due+'</td><td>'+(x.behind?'<span class="pill '+(x.behind>=5?'alert':'p1')+'">'+x.behind+'</span>':'<span class="pill good">on track</span>')+'</td><td class="small">'+esc(x.behindItems.slice(0,3).join(" · "))+'</td></tr>'; }).join("")+'</tbody></table>' : '<div class="muted">No students in this class yet.</div>')+'</div>';
  h+='<div class="card" style="margin-top:12px"><div class="row between" style="margin-bottom:6px"><h3>Day-by-day plan</h3><span class="muted small">Students tick items on their Today page; a study check-in on a chapter ticks it automatically.</span></div>'+planWeeksHtml(d.items, d.subjects, d.today, 0)+'</div>';
  $("tMain").innerHTML=h;
  var cur=document.querySelector('.pl-row[style]'); if(cur) cur.scrollIntoView({block:"center"});
}
$("tMain").addEventListener("click",function(e){
  if(T.view!=="plans") return;
  if(e.target.closest("[data-pmback]")){ e.preventDefault(); PM.detail=null; loadPlans(); return; }
  if(e.target.closest("button")) return;
  var tr=e.target.closest("tr[data-pid]"); if(tr){ loading(); api("/api/admin/plan?id="+tr.dataset.pid).then(function(d){ PM.detail=d; renderPlanDetail(); window.scrollTo(0,0); }).catch(showErr); }
});

function isOwner(){ return lsGet("ek_owner")!=="0"; }
function startTutor(){ LANG="en"; document.body.classList.toggle("staff", !isOwner()); var cl=document.querySelector('#tTabs [data-t="classes"]'); if(cl) cl.classList.add("owner-only");
  api("/api/admin/me").then(function(m){ lsSet("ek_owner", m.owner?"1":"0"); lsSet("ek_tname", m.name); document.body.classList.toggle("staff", !m.owner); var TABP={teach:"teach",homework:"homework",homework2:"revision",board:"board",plans:"plans",materials:"study",messages:"messages",live:"live"};
    Object.keys(TABP).forEach(function(k){ var tb=document.querySelector('#tTabs [data-t="'+TABP[k]+'"]'); var pk=k.replace(/2$/,""); if(tb) tb.style.display= (m.perms && m.perms[pk]===false)? "none" : ""; });
    if(m.perms && T.view && Object.keys(TABP).some(function(k){ return TABP[k]===T.view && m.perms[k]===false; })) tGo("students");
    var lg=document.querySelector("#tutor .t-head .logo"); if(lg) lg.textContent="Ekanthi · "+(m.owner?"Owner":m.name); }).catch(function(){});
  show("tutor"); if(!resumeTutor()) tGo("students"); ibStart(); setTimeout(function(){ showSetup(); }, 800);
  if(!isStandalone && !$("tInstall")){ var lo=document.querySelector("#tutor .t-head .btn.ghost"); if(lo){ var bi=document.createElement("button"); bi.id="tInstall"; bi.className="btn ghost sm"; bi.style.marginRight="8px"; bi.textContent="📲 Install app"; bi.onclick=function(){ showSetup(null,true); }; lo.parentNode.insertBefore(bi, lo); } } }

start();
})();
